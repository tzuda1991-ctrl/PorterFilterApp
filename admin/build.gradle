plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zuauto.porter.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.zu.admin"
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('zuVersionCode').map { it.toInteger() }.getOrElse(11)
        versionName providers.gradleProperty('zuVersionName').getOrElse('11.0-local')
    }

    def apkKeystore = providers.environmentVariable('ZU_APK_KEYSTORE_PATH').orNull
    if (apkKeystore != null) {
        signingConfigs {
            stable {
                storeFile file(apkKeystore)
                storeType 'PKCS12'
                keyAlias 'zu-smart'
                storePassword providers.environmentVariable('ZU_APK_STORE_PASSWORD').get()
                keyPassword providers.environmentVariable('ZU_APK_STORE_PASSWORD').get()
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.stable
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
