plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.zuauto.porter.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.zu.admin"
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('zuVersionCode').map { it.toInteger() }.getOrElse(11)
        versionName providers.gradleProperty('zuVersionName').getOrElse('11.0-local')
    }

    def apkKeystore = providers.environmentVariable('ZU_APK_KEYSTORE_PATH').orNull
    if (apkKeystore != null) {
        signingConfigs {
            stable {
                storeFile file(apkKeystore)
                storeType 'PKCS12'
                keyAlias 'zu-smart'
                storePassword providers.environmentVariable('ZU_APK_STORE_PASSWORD').get()
                keyPassword providers.environmentVariable('ZU_APK_STORE_PASSWORD').get()
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.stable
            }
        }
    }

    sourceSets.main.java.srcDir(rootProject.file("shared/src/main/java"))
    sourceSets.main.res.srcDir(rootProject.file("shared/src/main/res"))
    sourceSets.main.assets.srcDir(rootProject.file("shared/src/main/assets"))

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
